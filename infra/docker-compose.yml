version: '3.8'

services:
  # =============================================================================
  # DATABASES
  # =============================================================================
  postgres:
    image: postgres:16-alpine
    container_name: platform-postgres
    environment:
      POSTGRES_USER: platform
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-Platform2024!}
      POSTGRES_DB: platform_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init-scripts/postgres:/docker-entrypoint-initdb.d
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U platform -d platform_db"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  redis:
    image: redis:7-alpine
    container_name: platform-redis
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-Redis2024!}
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD:-Redis2024!}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - platform-network

  # =============================================================================
  # MESSAGE QUEUE
  # =============================================================================
  rabbitmq:
    image: rabbitmq:3.12-management-alpine
    container_name: platform-rabbitmq
    environment:
      RABBITMQ_DEFAULT_USER: platform
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-RabbitMQ2024!}
    ports:
      - "5672:5672"
      - "15672:15672"
    volumes:
      - rabbitmq_data:/var/lib/rabbitmq
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 30s
      timeout: 10s
      retries: 5
    networks:
      - platform-network

  # =============================================================================
  # OBSERVABILITY
  # =============================================================================
  jaeger:
    image: jaegertracing/all-in-one:1.52
    container_name: platform-jaeger
    environment:
      COLLECTOR_OTLP_ENABLED: true
    ports:
      - "6831:6831/udp"
      - "6832:6832/udp"
      - "5778:5778"
      - "16686:16686"
      - "4317:4317"
      - "4318:4318"
      - "14250:14250"
      - "14268:14268"
      - "14269:14269"
    networks:
      - platform-network

  prometheus:
    image: prom/prometheus:v2.48.0
    container_name: platform-prometheus
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--web.console.libraries=/etc/prometheus/console_libraries'
      - '--web.console.templates=/etc/prometheus/consoles'
      - '--web.enable-lifecycle'
    ports:
      - "9090:9090"
    networks:
      - platform-network

  grafana:
    image: grafana/grafana:10.2.2
    container_name: platform-grafana
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD:-Grafana2024!}
      GF_USERS_ALLOW_SIGN_UP: false
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
    depends_on:
      - prometheus
    networks:
      - platform-network

  # =============================================================================
  # API GATEWAY
  # =============================================================================
  nginx:
    image: nginx:1.25-alpine
    container_name: platform-gateway
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/certs:/etc/nginx/certs:ro
    depends_on:
      - iam-service
      - application-service
      - payment-service
    networks:
      - platform-network

  # =============================================================================
  # SERVICES
  # =============================================================================
  iam-service:
    build:
      context: ../src/services/iam
      dockerfile: Dockerfile
    container_name: platform-iam
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5001:8080"
      - "5051:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
    networks:
      - platform-network

  application-service:
    build:
      context: ../src/services/application
      dockerfile: Dockerfile
    container_name: platform-application
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5002:8080"
      - "5052:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  payment-service:
    build:
      context: ../src/services/payment
      dockerfile: Dockerfile
    container_name: platform-payment
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5003:8080"
      - "5053:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  ledger-service:
    build:
      context: ../src/services/ledger
      dockerfile: Dockerfile
    container_name: platform-ledger
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5004:8080"
      - "5054:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  audit-service:
    build:
      context: ../src/services/audit
      dockerfile: Dockerfile
    container_name: platform-audit
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5005:8080"
      - "5055:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  document-service:
    build:
      context: ../src/services/document
      dockerfile: Dockerfile
    container_name: platform-document
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5006:8080"
      - "5056:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  notification-service:
    build:
      context: ../src/services/notification
      dockerfile: Dockerfile
    container_name: platform-notification
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - RabbitMQ__Host=rabbitmq
      - RabbitMQ__Username=platform
      - RabbitMQ__Password=${RABBITMQ_PASSWORD:-RabbitMQ2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5007:8080"
      - "5057:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  reference-data-service:
    build:
      context: ../src/services/reference-data
      dockerfile: Dockerfile
    container_name: platform-reference-data
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__DefaultConnection=Host=postgres;Database=platform_db;Username=platform;Password=${POSTGRES_PASSWORD:-Platform2024!}
      - ConnectionStrings__Redis=redis:6379,password=${REDIS_PASSWORD:-Redis2024!}
      - Observability__JaegerEndpoint=http://jaeger:4317
    ports:
      - "5008:8080"
      - "5058:8081"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - platform-network

  # =============================================================================
  # FRONTEND
  # =============================================================================
  frontend:
    build:
      context: ../src/frontend
      dockerfile: Dockerfile
    container_name: platform-frontend
    ports:
      - "3001:80"
    depends_on:
      - nginx
    networks:
      - platform-network

volumes:
  postgres_data:
  redis_data:
  rabbitmq_data:
  prometheus_data:
  grafana_data:

networks:
  platform-network:
    driver: bridge
