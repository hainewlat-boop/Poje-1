# Main Nginx configuration for API Gateway
# TLS Termination, Rate Limiting, Security Headers

user nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
    use epoll;
    multi_accept on;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    # Logging format with correlation ID
    log_format json_combined escape=json
    '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"remote_user":"$remote_user",'
        '"request":"$request",'
        '"status":"$status",'
        '"body_bytes_sent":"$body_bytes_sent",'
        '"request_time":"$request_time",'
        '"http_referrer":"$http_referer",'
        '"http_user_agent":"$http_user_agent",'
        '"correlation_id":"$http_x_correlation_id",'
        '"request_id":"$request_id"'
    '}';

    access_log /var/log/nginx/access.log json_combined;

    # Performance
    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 2048;

    # Security
    server_tokens off;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml;

    # Rate limiting zones
    limit_req_zone $binary_remote_addr zone=login_limit:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api_limit:10m rate=100r/m;
    limit_req_zone $binary_remote_addr zone=payment_limit:10m rate=10r/m;
    limit_req_zone $binary_remote_addr zone=upload_limit:10m rate=5r/m;

    # Connection limiting
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # Upstream definitions
    upstream iam_service {
        server iam-service:8080;
        keepalive 32;
    }

    upstream application_service {
        server application-service:8080;
        keepalive 32;
    }

    upstream payment_service {
        server payment-service:8080;
        keepalive 32;
    }

    upstream ledger_service {
        server ledger-service:8080;
        keepalive 32;
    }

    upstream audit_service {
        server audit-service:8080;
        keepalive 32;
    }

    upstream document_service {
        server document-service:8080;
        keepalive 32;
    }

    upstream notification_service {
        server notification-service:8080;
        keepalive 32;
    }

    upstream reference_data_service {
        server reference-data-service:8080;
        keepalive 32;
    }

    # HTTP to HTTPS redirect
    server {
        listen 80;
        server_name _;
        
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # Main HTTPS server
    server {
        listen 443 ssl http2;
        server_name _;

        # SSL Configuration
        ssl_certificate /etc/nginx/certs/server.crt;
        ssl_certificate_key /etc/nginx/certs/server.key;
        ssl_session_timeout 1d;
        ssl_session_cache shared:SSL:50m;
        ssl_session_tickets off;

        # Modern SSL configuration
        ssl_protocols TLSv1.2 TLSv1.3;
        ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:ECDHE-ECDSA-CHACHA20-POLY1305:ECDHE-RSA-CHACHA20-POLY1305:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384;
        ssl_prefer_server_ciphers off;

        # HSTS
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

        # Security Headers
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header X-XSS-Protection "1; mode=block" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Content-Security-Policy "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data:; connect-src 'self'; frame-ancestors 'none';" always;

        # Connection limits
        limit_conn conn_limit 100;

        # Client body size limit
        client_max_body_size 10M;

        # Request timeout
        proxy_connect_timeout 60s;
        proxy_send_timeout 60s;
        proxy_read_timeout 60s;

        # Proxy headers
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-ID $request_id;
        proxy_set_header Connection "";

        # Health check
        location /health {
            return 200 'OK';
            add_header Content-Type text/plain;
        }

        # IAM Service routes
        location /api/auth {
            limit_req zone=login_limit burst=10 nodelay;
            proxy_pass http://iam_service;
        }

        location /api/users {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://iam_service;
        }

        location /api/sessions {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://iam_service;
        }

        location /api/otpt {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://iam_service;
        }

        location /api/policies {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://iam_service;
        }

        # Application Service routes
        location /api/applications {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://application_service;
        }

        location /api/tasks {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://application_service;
        }

        location /api/attachments {
            limit_req zone=upload_limit burst=5 nodelay;
            client_max_body_size 10M;
            proxy_pass http://application_service;
        }

        # Payment Service routes
        location /api/payments {
            limit_req zone=payment_limit burst=5 nodelay;
            proxy_pass http://payment_service;
        }

        location /api/payments/callback {
            # Bank callback - different limits
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://payment_service;
        }

        # Ledger Service routes
        location /api/ledger {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://ledger_service;
        }

        # Audit Service routes
        location /api/audit {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://audit_service;
        }

        # Document Service routes
        location /api/documents {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://document_service;
        }

        location /api/documents/download {
            limit_req zone=api_limit burst=20 nodelay;
            proxy_pass http://document_service;
        }

        # Notification Service routes
        location /api/notifications {
            limit_req zone=api_limit burst=50 nodelay;
            proxy_pass http://notification_service;
        }

        # Reference Data Service routes
        location /api/reference {
            limit_req zone=api_limit burst=100 nodelay;
            proxy_pass http://reference_data_service;
            
            # Cache reference data
            proxy_cache_valid 200 1h;
        }

        # Frontend static files
        location / {
            root /usr/share/nginx/html;
            index index.html;
            try_files $uri $uri/ /index.html;
        }

        # Error pages
        error_page 500 502 503 504 /50x.html;
        location = /50x.html {
            root /usr/share/nginx/html;
        }
    }
}
